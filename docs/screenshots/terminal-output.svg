<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Reader writer problem terminal preview</title>
  <desc id="desc">A terminal preview showing reader and writer threads safely accessing shared data and a passing stress test.</desc>
  <rect width="1200" height="650" rx="24" fill="#16181d"/><rect x="24" y="24" width="1152" height="602" rx="16" fill="#0d1117" stroke="#30363d"/><circle cx="57" cy="55" r="7" fill="#ff5f57"/><circle cx="81" cy="55" r="7" fill="#febc2e"/><circle cx="105" cy="55" r="7" fill="#28c840"/><text x="150" y="61" fill="#8b949e" font-family="monospace" font-size="14">reader-writer-problem — bash</text>
  <g font-family="monospace" font-size="18"><text x="58" y="115" fill="#79c0ff">$ make test</text><text x="58" y="154" fill="#8b949e">mkdir -p build</text><text x="58" y="187" fill="#8b949e">cc -std=c11 -Wall -Wextra -pthread ...</text><text x="58" y="236" fill="#79c0ff">./build/test_rwlock</text><text x="58" y="283" fill="#7ee787">reader-writer stress test passed</text><text x="58" y="336" fill="#79c0ff">$ ./build/reader_writer --readers 4 --writers 2 --iterations 5</text><text x="58" y="379" fill="#d2a8ff">Starting 4 readers and 2 writers for 5 iterations...</text><text x="58" y="416" fill="#8b949e">reader 1 observed value 0</text><text x="58" y="449" fill="#ffa657">writer 1 completed first update -&gt; 1</text><text x="58" y="501" fill="#8b949e">Completed 20 reads and 10 writes.</text><text x="58" y="538" fill="#7ee787">Final value: 10 (expected 10)</text><text x="58" y="590" fill="#79c0ff">$ _</text></g>
</svg>
