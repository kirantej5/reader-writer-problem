<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Writer-priority reader-writer synchronization</title>
  <desc id="desc">Readers share room empty through a reader counter, while writers use a turnstile to prevent readers from overtaking them.</desc>
  <rect width="1000" height="500" rx="24" fill="#f7f8fc"/>
  <text x="50" y="55" fill="#172033" font-family="Arial,sans-serif" font-size="25" font-weight="700">Writer-priority synchronization</text>
  <text x="50" y="83" fill="#718096" font-family="Arial,sans-serif" font-size="15">The turnstile stops new readers when a writer is waiting.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="65" y="150" width="190" height="100" rx="16" fill="#3867e8"/><text x="160" y="190" fill="#fff" font-size="18" font-weight="700">Readers</text><text x="160" y="219" fill="#dbe5ff" font-size="14">share access</text>
    <rect x="330" y="150" width="190" height="100" rx="16" fill="#7558da"/><text x="425" y="190" fill="#fff" font-size="18" font-weight="700">Turnstile</text><text x="425" y="219" fill="#eee9ff" font-size="14">queue writers fairly</text>
    <rect x="595" y="150" width="190" height="100" rx="16" fill="#159570"/><text x="690" y="190" fill="#fff" font-size="18" font-weight="700">Room empty</text><text x="690" y="219" fill="#ddfff1" font-size="14">exclusive resource</text>
    <rect x="825" y="150" width="110" height="100" rx="16" fill="#172033"/><text x="880" y="190" fill="#fff" font-size="18" font-weight="700">Shared</text><text x="880" y="219" fill="#cbd5e1" font-size="14">data</text>
  </g>
  <g fill="none" stroke="#718096" stroke-width="3" stroke-linecap="round"><path d="M255 200h65"/><path d="M520 200h65"/><path d="M785 200h30"/><path d="M425 280v75H160v-95"/><path d="M425 280v75h265v-95"/></g>
  <g fill="#718096" font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><text x="288" y="185">brief pass</text><text x="552" y="185">first reader locks</text><text x="800" y="185">read/write</text><text x="285" y="382">reader_mutex protects count</text><text x="560" y="382">writer holds turnstile</text></g>
</svg>
