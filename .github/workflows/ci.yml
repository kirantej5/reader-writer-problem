name: C CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install compiler and build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential

      - name: Build
        run: make

      - name: Run stress test
        run: make test

      - name: Run demo smoke test
        run: ./build/reader_writer --readers 2 --writers 1 --iterations 2 --delay-ms 1
